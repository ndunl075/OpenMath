name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version` here: pnpm/action-setup refuses to run when the version is
      # given both in the workflow and in package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The corpus is the gate: a wrong rewrite fails here rather than shipping.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm --filter @openmath/web build

      - name: Check the first load stays small
        run: node scripts/check-bundle-size.mjs
